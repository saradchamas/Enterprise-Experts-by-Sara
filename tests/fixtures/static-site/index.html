<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Parcel Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><img src="logo.svg"><h1>Parcel Tracker</h1></header>
  <main>
    <p class="hint">Enter your tracking number to see where your parcel is.</p>
    <form action="#">
      <input type="text" name="tracking" placeholder="Tracking number">
      <div class="btn" onclick="document.getElementById('result').textContent='Out for delivery'">Track</div>
    </form>
    <p id="result"></p>
    <a href="ar.html">العربية</a>
  </main>
</body>
</html>
