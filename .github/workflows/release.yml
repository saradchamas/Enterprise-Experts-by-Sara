name: Release

# Runs when a version tag is pushed (for example v0.5.0). It never runs on its own:
# publishing a release is a decision a person makes by pushing the tag.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write        # create the GitHub release
      id-token: write        # sign the build provenance
      attestations: write    # store the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: The tag must match the version in the code and the changelog
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(python skills/enterprise-experts/scripts/enterprise_experts.py --version)"
          test "v$version" = "$TAG" || { echo "tag $TAG does not match version $version"; exit 1; }
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "CHANGELOG.md has no entry for $version"; exit 1; }
      - name: Tests
        run: python -m unittest discover -s tests -t .
      - name: Build and verify the artifacts
        run: python tools/build_release.py --verify
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/enterprise-experts.skill
            dist/sbom.cdx.json
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {p=1; next} /^## \[/ {p=0} p' CHANGELOG.md > notes.md
          gh release create "$TAG" dist/enterprise-experts.skill dist/sbom.cdx.json dist/SHA256SUMS \
            --title "Enterprise Experts $TAG" --notes-file notes.md --verify-tag
