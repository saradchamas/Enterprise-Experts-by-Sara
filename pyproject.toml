# Development tooling only. The engine itself has no dependencies and is not
# installed as a package: it runs straight from skills/enterprise-experts/scripts.
[tool.ruff]
line-length = 125
target-version = "py310"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501"]  # long lines are allowed in tables and templates

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
